<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* Remove default browser margins and scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
        }
        /* Make the iframe fill the entire viewport */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block; /* Eliminates the default bottom inline gap */
        }
    </style>
</head>
<body>
    <iframe src="https://google-classroom.sriail.workers.dev/"></iframe>
</body>
</html>
